apiVersion: v1
kind: Pod
metadata:
  name: benchmark-client
  namespace: default
  labels:
    app: benchmark-client
spec:
  nodeSelector:
    role: generator
  restartPolicy: Never
  containers:
  - name: client
    image: networkstatic/iperf3:latest
    imagePullPolicy: IfNotPresent
    command: ["sleep", "infinity"]
