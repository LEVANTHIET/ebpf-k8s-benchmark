apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-server
  namespace: default
  labels:
    app: target-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-server
  template:
    metadata:
      labels:
        app: target-server
    spec:
      nodeSelector:
        role: target
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "500m"
            memory: "128Mi"
          limits:
            cpu: "2000m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: target-service
  namespace: default
  labels:
    app: target-server
spec:
  type: NodePort
  selector:
    app: target-server
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
